[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "household-meal-voice-agent"
version = "0.1.0"
description = "Household meal-planning voice agent (text-first core, voice thin layer)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=8.3",
  "pytest>=8.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
  "google-genai>=1.0",   # Gemini 2.5 Flash (verified name: google-genai, import google.genai)
  "groq>=0.9",           # Groq llama-3.3-70b-versatile (verified name: groq, import groq)
]

[tool.pytest.ini_options]
testpaths = ["evals", "scripts", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
